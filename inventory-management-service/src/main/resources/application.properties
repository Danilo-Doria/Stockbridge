spring.application.name=inventory-management-service
spring.datasource.url=jdbc:postgresql://localhost:5439/inventory
spring.datasource.username=inventory
spring.datasource.password=inventory
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.flyway.enabled=true

# JWT
app.security.jwt.secret=${JWT_SECRET:cambia-este-secreto-por-uno-de-minimo-32-caracteres}
app.security.jwt.expiration-minutes=60

# Admin inicial
app.security.bootstrap-admin.name=Administrador
app.security.bootstrap-admin.email=${ADMIN_EMAIL:admin@gmail.com}
app.security.bootstrap-admin.password=${ADMIN_PASSWORD:admin123}